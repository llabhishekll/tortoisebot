controller_server_node:
  ros__parameters:
    use_sim_time: True
    use_bond: False
    enable_stamped_cmd_vel: False
    controller_frequency: 10.0
    failure_tolerance: 2.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.05
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    current_goal_checker: "goal_checker"
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: True
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.2
      simulate_ahead_time: 1.0
      primary_controller:
        plugin: "dwb_core::DWBLocalPlanner"
        xy_goal_tolerance: 0.10
        min_vel_x: 0.0
        min_vel_y: 0.0
        max_vel_x: 0.20
        max_vel_y: 0.0
        max_vel_theta: 1.5
        min_speed_xy: 0.0
        max_speed_xy: 0.20
        min_speed_theta: 0.02
        acc_lim_x: 0.20
        acc_lim_theta: 1.5
        decel_lim_x: -1.5
        decel_lim_theta: -1.5
        vx_samples: 20
        vy_samples: 0
        vtheta_samples: 24
        sim_time: 1.0
        critics:
          [
            "BaseObstacle",
            "ObstacleFootprint",
            "GoalAlign",
            "PathAlign",
            "PathDist",
            "GoalDist",
            "RotateToGoal",
          ]
        BaseObstacle.scale: 0.10
        PathAlign.scale: 48.0
        GoalAlign.scale: 24.0
        PathDist.scale: 64.0
        GoalDist.scale: 64.0
        RotateToGoal.scale: 32.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: robot_base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.14
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 6.0
          obstacle_max_range: 5.5
          raytrace_min_range: 0.12
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.5
      always_send_full_costmap: False
