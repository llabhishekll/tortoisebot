localization_node:
  ros__parameters:
    use_sim_time: True
    use_bond: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.1
    alpha4: 0.2
    alpha5: 0.1
    base_frame_id: robot_base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    laser_model_type: likelihood_field
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_min_range: 0.12
    laser_max_range: 12.0
    max_particles: 2000
    min_particles: 500
    tf_broadcast: true
    transform_tolerance: 1.0
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
